name: Publish to npm

# Pushing a version tag such as v0.4.2 publishes that version with npm trusted publishing (OIDC).
# Running the workflow by hand only rehearses the release: the same checks and npm publish --dry-run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish docatlas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check the release commit and version
        run: |
          version="$(node -p "require('./package.json').version")"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main. Tag a commit that is already on main."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi
          echo "docatlas@$version from $GITHUB_SHA ($GITHUB_REF_NAME)"
      - name: Use npm 11.5.1 or later for trusted publishing
        run: |
          current="$(npm --version)"
          if node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);" "$current"; then
            echo "npm $current"
          else
            npm install -g npm@11
            echo "npm $current -> $(npm --version)"
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - name: Publish
        if: github.event_name == 'push'
        run: npm publish
      - name: Rehearse publishing
        if: github.event_name == 'workflow_dispatch'
        run: npm publish --dry-run
